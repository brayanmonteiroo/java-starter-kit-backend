spring:
  application:
    name: java-starter-kit-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5438/java_starter}
    username: ${DATABASE_USERNAME:starter}
    password: ${DATABASE_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8098}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-256-bits-long-please}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  mail:
    from: ${MAIL_FROM:noreply@java-starter.test}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@java-starter.test}
    admin-password: ${SEED_ADMIN_PASSWORD:password}
    admin-name: ${SEED_ADMIN_NAME:Admin}

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

logging:
  level:
    com.brayanmonteiro.starter: INFO
